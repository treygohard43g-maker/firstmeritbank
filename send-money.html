<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Send Money | First Merit Bank</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .page-header {
      height: 68px;
      background: #fff;
      border-bottom: 1px solid #e7ebf1;
      display: flex;
      align-items: center;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 11px;
      background: #f3f5f9;
      color: #173b72;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .page-title {
      font-size: 16px;
      font-weight: 750;
      color: #172554;
    }

    .page-container {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .intro {
      margin-bottom: 18px;
    }

    .intro h1 {
      font-size: 24px;
      margin-bottom: 5px;
      color: #172033;
    }

    .intro p {
      color: #8a93a3;
      font-size: 13px;
    }

    .balance-card {
      background: linear-gradient(135deg, #123b78, #1d579c);
      color: #fff;
      border-radius: 18px;
      padding: 17px 18px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(18, 59, 120, .14);
    }

    .balance-label {
      font-size: 11px;
      color: rgba(255,255,255,.72);
      margin-bottom: 4px;
    }

    .balance-value {
      font-size: 24px;
      font-weight: 780;
    }

    .form-card {
      background: #fff;
      border: 1px solid #e7ebf1;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(15,23,42,.035);
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      color: #4b5563;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #8792a4;
      font-size: 13px;
    }

    .input-wrap input {
      width: 100%;
      height: 48px;
      border: 1px solid #dfe4ec;
      border-radius: 12px;
      padding: 0 13px 0 39px;
      outline: none;
      font-size: 14px;
      color: #172033;
      background: #fff;
    }

    .input-wrap input:focus {
      border-color: #2b5fa4;
      box-shadow: 0 0 0 3px rgba(43,95,164,.08);
    }

    .amount-wrap input {
      font-size: 20px;
      font-weight: 700;
    }

    .amount-prefix {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      font-weight: 700;
      color: #5f6b7d;
    }

    .amount-wrap input {
      padding-left: 34px;
    }

    textarea {
      width: 100%;
      min-height: 85px;
      resize: vertical;
      border: 1px solid #dfe4ec;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      outline: none;
    }

    textarea:focus {
      border-color: #2b5fa4;
      box-shadow: 0 0 0 3px rgba(43,95,164,.08);
    }

    .send-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #123b78;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 19px;
    }

    .send-btn:hover {
      background: #0e3267;
    }

    .send-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff1f2;
      color: #b42332;
      border: 1px solid #ffd5da;
    }

    .message.success {
      background: #edfdf6;
      color: #08744b;
      border: 1px solid #c8f2df;
    }

    /* Review */

    .review-card {
      display: none;
    }

    .review-card.show {
      display: block;
    }

    .review-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #edf0f4;
      font-size: 13px;
    }

    .review-row:last-child {
      border-bottom: none;
    }

    .review-label {
      color: #8a93a3;
    }

    .review-value {
      color: #263142;
      font-weight: 650;
      text-align: right;
      word-break: break-word;
    }

    .review-amount {
      font-size: 23px;
      color: #172554;
    }

    .confirm-btn,
    .edit-btn {
      width: 100%;
      height: 47px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .confirm-btn {
      border: none;
      background: #123b78;
      color: white;
    }

    .edit-btn {
      border: 1px solid #dfe4ec;
      background: #fff;
      color: #465268;
    }

    /* Success */

    .success-card {
      display: none;
      background: #fff;
      border: 1px solid #e7ebf1;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
    }

    .success-card.show {
      display: block;
    }

    .success-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #eaf9f2;
      color: #12815a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 23px;
    }

    .success-card h2 {
      font-size: 20px;
      color: #172033;
      margin-bottom: 6px;
    }

    .success-card p {
      color: #8a93a3;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .success-details {
      background: #f7f9fc;
      border-radius: 13px;
      padding: 4px 14px;
      text-align: left;
      margin-bottom: 18px;
    }

    .success-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #e9edf3;
      font-size: 11px;
    }

    .success-row:last-child {
      border-bottom: none;
    }

    .success-row span:first-child {
      color: #8a93a3;
    }

    .success-row span:last-child {
      color: #263142;
      font-weight: 650;
      text-align: right;
    }

    .dashboard-btn {
      width: 100%;
      height: 47px;
      border: none;
      border-radius: 12px;
      background: #123b78;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .simulation-note {
      text-align: center;
      color: #a0a8b6;
      font-size: 10px;
      margin-top: 17px;
    }

    @media (max-width: 390px) {
      .page-container {
        padding-left: 12px;
        padding-right: 12px;
      }

      .form-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="page-header">

    <button class="back-btn" id="backBtn" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="page-title">Send Money</div>

  </header>


  <main class="page-container">

    <!-- INTRO -->
    <section class="intro">
      <h1>Send Money</h1>
      <p>Send money from your First Merit Bank account.</p>
    </section>


    <!-- BALANCE -->
    <section class="balance-card">

      <div class="balance-label">
        Available Balance
      </div>

      <div class="balance-value" id="availableBalance">
        $400,000.00
      </div>

    </section>


    <!-- ERROR / SUCCESS MESSAGE -->
    <div class="message error" id="errorMessage"></div>


    <!-- FORM -->
    <section class="form-card" id="formCard">

      <div class="field">

        <label for="recipientName">
          Recipient Name
        </label>

        <div class="input-wrap">

          <i class="fa-regular fa-user"></i>

          <input
            type="text"
            id="recipientName"
            placeholder="Enter recipient name"
            autocomplete="off"
          >

        </div>

      </div>


      <div class="field">

        <label for="recipientAccount">
          Recipient Account Number
        </label>

        <div class="input-wrap">

          <i class="fa-solid fa-building-columns"></i>

          <input
            type="text"
            id="recipientAccount"
            placeholder="Enter account number"
            inputmode="numeric"
            autocomplete="off"
          >

        </div>

      </div>


      <div class="field">

        <label for="amount">
          Amount
        </label>

        <div class="input-wrap amount-wrap">

          <span class="amount-prefix">$</span>

          <input
            type="number"
            id="amount"
            placeholder="0.00"
            min="0.01"
            step="0.01"
          >

        </div>

      </div>


      <div class="field">

        <label for="note">
          Note <span style="color:#9aa3b2;">(Optional)</span>
        </label>

        <textarea
          id="note"
          placeholder="Add a note..."
        ></textarea>

      </div>


      <button class="send-btn" id="reviewBtn">
        Review Transfer
      </button>

    </section>


    <!-- REVIEW -->
    <section class="form-card review-card" id="reviewCard">

      <div class="review-row">
        <span class="review-label">Recipient</span>
        <span class="review-value" id="reviewRecipient"></span>
      </div>

      <div class="review-row">
        <span class="review-label">Account</span>
        <span class="review-value" id="reviewAccount"></span>
      </div>

      <div class="review-row">
        <span class="review-label">Amount</span>
        <span class="review-value review-amount" id="reviewAmount"></span>
      </div>

      <div class="review-row">
        <span class="review-label">Note</span>
        <span class="review-value" id="reviewNote"></span>
      </div>

      <button class="confirm-btn" id="confirmBtn">
        <i class="fa-solid fa-check"></i>
        Confirm &amp; Send
      </button>

      <button class="edit-btn" id="editBtn">
        Edit Transfer
      </button>

    </section>


    <!-- SUCCESS -->
    <section class="success-card" id="successCard">

      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <h2>Transfer Complete</h2>

      <p>
        Your simulated money transfer has been recorded successfully.
      </p>

      <div class="success-details">

        <div class="success-row">
          <span>Recipient</span>
          <span id="successRecipient"></span>
        </div>

        <div class="success-row">
          <span>Amount</span>
          <span id="successAmount"></span>
        </div>

        <div class="success-row">
          <span>Transaction ID</span>
          <span id="successTransactionId"></span>
        </div>

      </div>

      <button class="dashboard-btn" id="dashboardBtn">
        Back to Dashboard
      </button>

    </section>


    <div class="simulation-note">
      Simulation only — no real money is transferred.
    </div>

  </main>


  <script type="module">

    import {
      auth,
      db
    } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      doc,
      collection,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       ELEMENTS
    ========================= */

    const backBtn = document.getElementById("backBtn");

    const availableBalance =
      document.getElementById("availableBalance");

    const formCard =
      document.getElementById("formCard");

    const reviewCard =
      document.getElementById("reviewCard");

    const successCard =
      document.getElementById("successCard");

    const errorMessage =
      document.getElementById("errorMessage");

    const recipientName =
      document.getElementById("recipientName");

    const recipientAccount =
      document.getElementById("recipientAccount");

    const amount =
      document.getElementById("amount");

    const note =
      document.getElementById("note");

    const reviewBtn =
      document.getElementById("reviewBtn");

    const confirmBtn =
      document.getElementById("confirmBtn");

    const editBtn =
      document.getElementById("editBtn");

    const dashboardBtn =
      document.getElementById("dashboardBtn");


    let currentUser = null;
    let currentBalance = 0;
    let pendingAmount = 0;
    let transactionId = "";


    /* =========================
       AUTH
    ========================= */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;

      await loadBalance();

    });


    /* =========================
       LOAD BALANCE
    ========================= */

    async function loadBalance() {

      try {

        const userRef = doc(
          db,
          "users",
          currentUser.uid
        );

        const userSnap =
          await import(
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
          ).then(({ getDoc }) => getDoc(userRef));

        if (!userSnap.exists()) {
          showError("Your account could not be found.");
          return;
        }

        const data = userSnap.data();

        currentBalance = Number(data.balance || 0);

        updateBalance();

      } catch (error) {

        console.error(error);

        showError(
          "Unable to load your account balance."
        );

      }

    }


    function updateBalance() {

      availableBalance.textContent =
        formatCurrency(currentBalance);

    }


    /* =========================
       REVIEW
    ========================= */

    reviewBtn.addEventListener("click", () => {

      clearError();

      const name =
        recipientName.value.trim();

      const account =
        recipientAccount.value.trim();

      const amountValue =
        Number(amount.value);

      if (!name) {
        showError("Please enter the recipient name.");
        return;
      }

      if (!account) {
        showError("Please enter the recipient account number.");
        return;
      }

      if (!/^[0-9]+$/.test(account)) {
        showError("Account number must contain numbers only.");
        return;
      }

      if (!amountValue || amountValue <= 0) {
        showError("Please enter a valid amount.");
        return;
      }

      if (amountValue > currentBalance) {
        showError("Insufficient available balance.");
        return;
      }

      pendingAmount = amountValue;

      document.getElementById("reviewRecipient").textContent =
        name;

      document.getElementById("reviewAccount").textContent =
        account;

      document.getElementById("reviewAmount").textContent =
        formatCurrency(amountValue);

      document.getElementById("reviewNote").textContent =
        note.value.trim() || "No note";

      formCard.style.display = "none";
      reviewCard.classList.add("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });


    /* =========================
       EDIT
    ========================= */

    editBtn.addEventListener("click", () => {

      reviewCard.classList.remove("show");
      formCard.style.display = "block";

      clearError();

    });


    /* =========================
       CONFIRM TRANSFER
    ========================= */

    confirmBtn.addEventListener("click", async () => {

      clearError();

      if (!currentUser) {
        showError("Please sign in again.");
        return;
      }

      if (!pendingAmount || pendingAmount <= 0) {
        showError("Invalid transfer amount.");
        return;
      }

      confirmBtn.disabled = true;
      confirmBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';

      try {

        const userRef = doc(
          db,
          "users",
          currentUser.uid
        );

        const transactionRef = doc(
          collection(
            db,
            "users",
            currentUser.uid,
            "transactions"
          )
        );


        await runTransaction(
          db,
          async (transaction) => {

            const userSnap =
              await transaction.get(userRef);

            if (!userSnap.exists()) {
              throw new Error("ACCOUNT_NOT_FOUND");
            }

            const userData =
              userSnap.data();

            const balance =
              Number(userData.balance || 0);


            if (balance < pendingAmount) {
              throw new Error("INSUFFICIENT_FUNDS");
            }


            const newBalance =
              balance - pendingAmount;


            transaction.update(
              userRef,
              {
                balance: newBalance
              }
            );


            transaction.set(
              transactionRef,
              {
                type: "send",
                title: "Money Sent",
                amount: pendingAmount,
                direction: "debit",

                recipient: recipientName.value.trim(),

                recipientAccount:
                  recipientAccount.value.trim(),

                note:
                  note.value.trim() || "",

                status: "completed",

                createdAt: serverTimestamp()
              }
            );

          }
        );


        transactionId = transactionRef.id;

        currentBalance =
          currentBalance - pendingAmount;

        updateBalance();

        showSuccess();


      } catch (error) {

        console.error(error);

        if (error.message === "INSUFFICIENT_FUNDS") {

          showError(
            "Insufficient available balance."
          );

        } else if (error.message === "ACCOUNT_NOT_FOUND") {

          showError(
            "Your account could not be found."
          );

        } else {

          showError(
            "The transfer could not be completed. Please try again."
          );

        }

        confirmBtn.disabled = false;

        confirmBtn.innerHTML =
          '<i class="fa-solid fa-check"></i> Confirm &amp; Send';

      }

    });


    /* =========================
       SUCCESS
    ========================= */

    function showSuccess() {

      reviewCard.classList.remove("show");

      successCard.classList.add("show");

      document.getElementById("successRecipient")
        .textContent =
        recipientName.value.trim();

      document.getElementById("successAmount")
        .textContent =
        formatCurrency(pendingAmount);

      document.getElementById("successTransactionId")
        .textContent =
        transactionId.substring(0, 12);

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================
       BACK
    ========================= */

    backBtn.addEventListener("click", () => {

      window.location.href = "dashboard.html";

    });


    dashboardBtn.addEventListener("click", () => {

      window.location.href = "dashboard.html";

    });


    /* =========================
       HELPERS
    ========================= */

    function formatCurrency(value) {

      return new Intl.NumberFormat(
        "en-US",
        {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2
        }
      ).format(value);

    }


    function showError(message) {

      errorMessage.textContent = message;

      errorMessage.classList.add("show");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function clearError() {

      errorMessage.textContent = "";

      errorMessage.classList.remove("show");

    }

  </script>

</body>
</html>
