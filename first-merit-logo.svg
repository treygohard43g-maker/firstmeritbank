<svg
  width="420"
  height="110"
  viewBox="0 0 420 110"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <!-- Main navy → cyan gradient -->
    <linearGradient
      id="mainGradient"
      x1="15"
      y1="10"
      x2="95"
      y2="100"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#071B3A"/>
      <stop offset="0.55" stop-color="#0A3F73"/>
      <stop offset="1" stop-color="#08B8C8"/>
    </linearGradient>

    <!-- Merit gold -->
    <linearGradient
      id="goldGradient"
      x1="15"
      y1="10"
      x2="90"
      y2="90"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFE28A"/>
      <stop offset="1" stop-color="#D69A2D"/>
    </linearGradient>
  </defs>


  <!-- ========================= -->
  <!-- PREMIUM FM EMBLEM          -->
  <!-- ========================= -->

  <rect
    x="5"
    y="5"
    width="100"
    height="100"
    rx="28"
    fill="url(#mainGradient)"
  />


  <!-- subtle inner border -->
  <rect
    x="10"
    y="10"
    width="90"
    height="90"
    rx="23"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="1"
  />


  <!-- F -->
  <path
    d="
      M27 30
      H66
      V40
      H39
      V48
      H61
      V58
      H39
      V80
      H27
      Z
    "
    fill="white"
  />


  <!-- M -->
  <path
    d="
      M53 80
      V30
      H64
      L78 51
      L92 30
      V80
      H81
      V50
      L78 57
      L75 50
      V80
      Z
    "
    fill="white"
  />


  <!-- Gold merit line -->
  <path
    d="
      M27 86
      H91
    "
    stroke="url(#goldGradient)"
    stroke-width="4"
    stroke-linecap="round"
  />


  <!-- Small merit diamond -->
  <path
    d="
      M90 18
      L94 27
      L103 31
      L94 35
      L90 44
      L86 35
      L77 31
      L86 27
      Z
    "
    fill="url(#goldGradient)"
  />


  <!-- ========================= -->
  <!-- WORDMARK                  -->
  <!-- ========================= -->

  <text
    x="130"
    y="57"
    font-family="Arial, Helvetica, sans-serif"
    font-size="29"
    font-weight="700"
    letter-spacing="1.8"
    fill="#071B3A"
  >
    FIRST MERIT
  </text>


  <text
    x="132"
    y="81"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="5"
    fill="#159EB2"
  >
    BANK
  </text>


  <!-- subtle gold accent -->
  <rect
    x="130"
    y="89"
    width="54"
    height="3"
    rx="1.5"
    fill="url(#goldGradient)"
  />

</svg>
