<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | First Merit Bank</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-container">

      <div class="auth-logo">FM</div>

      <h1>Welcome back</h1>

      <p class="auth-subtitle">
        Sign in to your First Merit Bank account to manage
        your account and view your balances.
      </p>

      <form id="loginForm" class="auth-card">

        <div class="form-section-title">
          Account Sign In
        </div>

        <div class="input-group">
          <label for="loginEmail">Email Address</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="input-group">

          <div class="password-label">
            <label for="loginPassword">Password</label>

            <a href="#" id="forgotPassword">
              Forgot password?
            </a>
          </div>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

        <button type="submit" class="auth-button">
          Sign In
        </button>

        <p id="loginMessage" class="auth-message"></p>

      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to First Merit Bank
      </a>

      <p class="demo">
        Demo banking environment • No real money
      </p>

    </div>

  </main>

  <script type="module" src="script.js"></script>

</body>
</html>
